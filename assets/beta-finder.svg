<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-labelledby="title desc">
  <title id="title">Beta Finder</title>
  <desc id="desc">In progress. Reads a bouldering video, finds the route's holds by colour and tracks 33 body landmarks per frame. Next up: suggesting the beta. Python, OpenCV, MediaPipe.</desc>

  <defs>
    <radialGradient id="light" cx="180" cy="150" r="260" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22262D"/>
      <stop offset="1" stop-color="#1A1D22"/>
    </radialGradient>
    <pattern id="tnuts" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="16" cy="16" r="1.6" fill="#2A2E36"/>
    </pattern>
    <clipPath id="panel">
      <rect width="1000" height="300" rx="16"/>
    </clipPath>
  </defs>

  <style>
    .display { font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
    .mono { font-family: ui-monospace, "SF Mono", "Cascadia Code", Consolas, Menlo, monospace; }
    .hold { fill: #3FB57A; fill-opacity: .2; stroke: #3FB57A; stroke-width: 2.5; stroke-linejoin: round; }
    .tag circle { fill: #3FB57A; }
    .tag text { fill: #0E1712; font-size: 13px; font-weight: 700; text-anchor: middle; }
    .halo { stroke: #1F2329; stroke-width: 12; stroke-linecap: round; fill: none; }
    .bone { stroke-width: 5; stroke-linecap: round; fill: none; }
    .left { stroke: #4C8DF6; }
    .right { stroke: #F28C28; }
    .mid { stroke: #ECE8DF; }
    .joint { fill: #ECE8DF; stroke: #17191E; stroke-width: 2; }
  </style>

  <g clip-path="url(#panel)">
    <rect width="1000" height="300" fill="#17191E"/>

    <!-- illustration: cropped frame from a climb -->
    <rect width="360" height="300" fill="url(#light)"/>
    <rect width="360" height="300" fill="url(#tnuts)"/>
    <line x1="360" y1="0" x2="360" y2="300" stroke="#23272E" stroke-width="2"/>
    <text x="18" y="30" class="mono" font-size="12" fill="#8B9099">frame 0412</text>

    <!-- same climber and holds as the header, cropped -->
    <g transform="translate(-720 0)">
      <polygon class="hold" points="962,295 967,284 981,281 994,285 999,294 990,301 970,301"/>
      <polygon class="hold" points="767,240 772,226 787,221 802,227 806,240 795,250 776,249"/>
      <polygon class="hold" points="808,154 814,140 831,136 848,140 854,152 845,163 821,163"/>
      <polygon class="hold" points="951,58 957,45 973,41 988,46 994,57 984,67 962,67"/>

      <path class="halo" d="M872 168 L920 156 M884 246 L916 240 M872 168 L884 246 M920 156 L916 240 M872 168 L842 206 L832 164 L830 154 M920 156 L948 112 L968 70 L971 60 M884 246 L868 298 L858 346 M916 240 L966 228 L966 280 L978 288 M899 139 L896 162"/>
      <path class="bone mid" d="M872 168 L920 156 M884 246 L916 240 M899 139 L896 162"/>
      <path class="bone left" d="M872 168 L884 246 M872 168 L842 206 L832 164 L830 154 M884 246 L868 298 L858 346"/>
      <path class="bone right" d="M920 156 L916 240 M920 156 L948 112 L968 70 L971 60 M916 240 L966 228 L966 280 L978 288"/>
      <circle cx="900" cy="124" r="15" fill="#1F2329" stroke="#ECE8DF" stroke-width="3"/>
      <circle class="joint" cx="872" cy="168" r="4.5"/>
      <circle class="joint" cx="920" cy="156" r="4.5"/>
      <circle class="joint" cx="842" cy="206" r="4.5"/>
      <circle class="joint" cx="948" cy="112" r="4.5"/>
      <circle class="joint" cx="832" cy="164" r="4.5"/>
      <circle class="joint" cx="968" cy="70" r="4.5"/>
      <circle class="joint" cx="884" cy="246" r="4.5"/>
      <circle class="joint" cx="916" cy="240" r="4.5"/>
      <circle class="joint" cx="868" cy="298" r="4.5"/>
      <circle class="joint" cx="966" cy="228" r="4.5"/>
      <circle class="joint" cx="966" cy="280" r="4.5"/>

      <g class="mono">
        <g class="tag"><circle cx="1006" cy="276" r="11"/><text x="1006" y="276" dy=".35em">3</text></g>
        <g class="tag"><circle cx="764" cy="220" r="11"/><text x="764" y="220" dy=".35em">4</text></g>
        <g class="tag"><circle cx="806" cy="134" r="11"/><text x="806" y="134" dy=".35em">5</text></g>
        <g class="tag"><circle cx="998" cy="38" r="11"/><text x="998" y="38" dy=".35em">6</text></g>
      </g>
    </g>

    <!-- copy -->
    <rect x="400" y="40" width="136" height="30" rx="15" fill="#3FB57A" fill-opacity=".14" stroke="#3FB57A" stroke-width="1.5"/>
    <text x="468" y="55" dy=".35em" class="mono" font-size="13" font-weight="700" letter-spacing="2.5" text-anchor="middle" fill="#3FB57A">PROJECTING</text>
    <text x="398" y="128" class="display" font-size="54" font-weight="800" letter-spacing="-1" fill="#ECE8DF">Beta Finder</text>
    <text class="display" font-size="21" fill="#B9B5AC">
      <tspan x="400" y="172">Reads a bouldering video, finds the route's</tspan>
      <tspan x="400" y="202">holds by colour and tracks 33 body landmarks</tspan>
      <tspan x="400" y="232">per frame. Next up: suggesting the beta.</tspan>
    </text>
    <text x="400" y="270" class="mono" font-size="15" fill="#8B9099">Python · OpenCV · MediaPipe</text>
    <text x="960" y="270" class="mono" font-size="15" text-anchor="end" fill="#3FB57A">bouldering-analysis →</text>
  </g>
</svg>
