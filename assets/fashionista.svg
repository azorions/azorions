<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-labelledby="title desc">
  <title id="title">Fashionista</title>
  <desc id="desc">In progress. Photograph your clothes and each one becomes a clean tile in a private closet. Try outfits on screen before putting them on. TypeScript, Expo, Supabase.</desc>

  <defs>
    <radialGradient id="light" cx="820" cy="140" r="260" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22262D"/>
      <stop offset="1" stop-color="#1A1D22"/>
    </radialGradient>
    <pattern id="tnuts" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="16" cy="16" r="1.6" fill="#2A2E36"/>
    </pattern>
    <clipPath id="panel">
      <rect width="1000" height="300" rx="16"/>
    </clipPath>
  </defs>

  <style>
    .display { font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
    .mono { font-family: ui-monospace, "SF Mono", "Cascadia Code", Consolas, Menlo, monospace; }
    .tile { fill: #22262E; stroke: #2E333C; stroke-width: 1.5; }
    .tile.picked { stroke: #3FB57A; stroke-width: 2.5; }
    .garment { fill: #ECE8DF; fill-opacity: .9; }
    .seam { stroke: #22262E; stroke-width: 2.5; stroke-linecap: round; fill: none; }
    .check circle { fill: #3FB57A; }
    .check path { stroke: #0E1712; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
  </style>

  <g clip-path="url(#panel)">
    <rect width="1000" height="300" fill="#17191E"/>

    <!-- copy -->
    <rect x="48" y="40" width="136" height="30" rx="15" fill="#3FB57A" fill-opacity=".14" stroke="#3FB57A" stroke-width="1.5"/>
    <text x="116" y="55" dy=".35em" class="mono" font-size="13" font-weight="700" letter-spacing="2.5" text-anchor="middle" fill="#3FB57A">PROJECTING</text>
    <text x="46" y="128" class="display" font-size="54" font-weight="800" letter-spacing="-1" fill="#ECE8DF">Fashionista</text>
    <text class="display" font-size="21" fill="#B9B5AC">
      <tspan x="48" y="172">Photograph your clothes and each one</tspan>
      <tspan x="48" y="202">becomes a clean tile in a private closet.</tspan>
      <tspan x="48" y="232">Try outfits on screen before putting them on.</tspan>
    </text>
    <text x="48" y="270" class="mono" font-size="15" fill="#8B9099">TypeScript · Expo · Supabase</text>
    <text x="600" y="270" class="mono" font-size="15" text-anchor="end" fill="#3FB57A">fashionista →</text>

    <!-- illustration: the closet grid -->
    <rect x="640" width="360" height="300" fill="url(#light)"/>
    <rect x="640" width="360" height="300" fill="url(#tnuts)"/>
    <line x1="640" y1="0" x2="640" y2="300" stroke="#23272E" stroke-width="2"/>

    <rect class="tile picked" x="671" y="40" width="90" height="90" rx="12"/>
    <rect class="tile" x="775" y="40" width="90" height="90" rx="12"/>
    <rect class="tile" x="879" y="40" width="90" height="90" rx="12"/>
    <rect class="tile picked" x="671" y="144" width="90" height="90" rx="12"/>
    <rect class="tile" x="775" y="144" width="90" height="90" rx="12"/>
    <rect class="tile picked" x="879" y="144" width="90" height="90" rx="12"/>

    <!-- tee -->
    <g transform="translate(716 87)">
      <path class="garment" d="M-13 -24 L-27 -17 L-35 -3 L-24 3 L-20 -5 L-20 26 L20 26 L20 -5 L24 3 L35 -3 L27 -17 L13 -24 C8 -17 -8 -17 -13 -24 Z"/>
    </g>
    <!-- jacket -->
    <g transform="translate(820 85)">
      <path class="garment" d="M-12 -26 L-26 -19 L-32 22 L-23 23 L-20 -4 L-20 28 L20 28 L20 -4 L23 23 L32 22 L26 -19 L12 -26 L0 -10 Z"/>
      <path class="seam" d="M0 -8 L0 26"/>
    </g>
    <!-- cap -->
    <g transform="translate(918 90)">
      <path class="garment" d="M-24 10 C-24 -18 20 -18 20 10 Z"/>
      <path class="garment" d="M14 10 L38 14 C36 19 26 20 8 15 Z"/>
      <path class="seam" d="M-2 -13 L-2 9"/>
    </g>
    <!-- trousers -->
    <g transform="translate(716 189)">
      <path class="garment" d="M-18 -28 L18 -28 L23 28 L7 28 L0 -4 L-7 28 L-23 28 Z"/>
      <path class="seam" d="M-18 -21 L18 -21"/>
    </g>
    <!-- skirt -->
    <g transform="translate(820 189)">
      <path class="garment" d="M-13 -24 L13 -24 L28 22 C10 27 -10 27 -28 22 Z"/>
      <path class="seam" d="M-14 -17 L14 -17"/>
    </g>
    <!-- sneaker -->
    <g transform="translate(922 192)">
      <path class="garment" d="M-34 12 L-34 -2 C-28 -3 -22 -8 -18 -16 L-6 -16 C-2 -7 8 -3 18 -1 L28 1 C34 3 36 7 36 12 Z"/>
      <path class="seam" d="M-34 5 L36 5 M-12 -10 L-6 -6 M-8 -13 L-2 -9"/>
    </g>

    <g class="check" transform="translate(751 50)"><circle r="9"/><path d="M-4 0 L-1 3 L4 -3"/></g>
    <g class="check" transform="translate(751 154)"><circle r="9"/><path d="M-4 0 L-1 3 L4 -3"/></g>
    <g class="check" transform="translate(959 154)"><circle r="9"/><path d="M-4 0 L-1 3 L4 -3"/></g>

    <text x="820" y="270" class="mono" font-size="13" text-anchor="middle" fill="#8B9099">outfit 01 · 3 pieces</text>
  </g>
</svg>
