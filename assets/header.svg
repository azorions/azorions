<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-labelledby="title desc">
  <title id="title">Ivan Kenneth</title>
  <desc id="desc">Computer Science, Software Technology, De La Salle University Manila. A climbing wall with a numbered route of seven green holds and a pose-tracking skeleton mid-climb.</desc>

  <defs>
    <radialGradient id="light" cx="900" cy="190" r="560" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#21252C"/>
      <stop offset="1" stop-color="#17191E"/>
    </radialGradient>
    <pattern id="tnuts" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="16" cy="16" r="1.6" fill="#2A2E36"/>
    </pattern>
    <clipPath id="panel">
      <rect width="1200" height="400" rx="16"/>
    </clipPath>
    <mask id="route-reveal" maskUnits="userSpaceOnUse" x="0" y="0" width="1200" height="400">
      <path class="reveal" pathLength="1" d="M868 398 C864 340 892 300 898 244 S928 126 968 74 S1058 44 1088 44" fill="none" stroke="#fff" stroke-width="18" stroke-linecap="round"/>
    </mask>
  </defs>

  <style>
    .display { font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
    .mono { font-family: ui-monospace, "SF Mono", "Cascadia Code", Consolas, Menlo, monospace; }
    .hold { fill: #3FB57A; fill-opacity: .2; stroke: #3FB57A; stroke-width: 2.5; stroke-linejoin: round; }
    .tag circle { fill: #3FB57A; }
    .tag text { fill: #0E1712; font-size: 13px; font-weight: 700; text-anchor: middle; }
    .halo { stroke: #1D2026; stroke-width: 12; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .bone { stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .left { stroke: #4C8DF6; }
    .right { stroke: #F28C28; }
    .mid { stroke: #ECE8DF; }
    .joint { fill: #ECE8DF; stroke: #17191E; stroke-width: 2; }
    .reveal { stroke-dasharray: 1; stroke-dashoffset: 0; }

    @media (prefers-reduced-motion: no-preference) {
      .reveal { animation: draw 2.4s cubic-bezier(.25, .7, .25, 1) .4s both; }
      .tag { animation: fade .35s ease-out both; }
      @keyframes draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
      @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
    }
  </style>

  <g clip-path="url(#panel)">
    <!-- wall -->
    <rect width="1200" height="400" fill="url(#light)"/>
    <rect width="1200" height="400" fill="url(#tnuts)"/>
    <line x1="700" y1="0" x2="700" y2="400" stroke="#1C1F25" stroke-width="2"/>

    <!-- name block -->
    <text x="64" y="64" class="mono" font-size="14" letter-spacing="3" fill="#8B9099">AZORIONS · MANILA, PH</text>
    <text x="58" y="156" class="display" font-size="96" font-weight="800" letter-spacing="-2" fill="#ECE8DF">IVAN</text>
    <text x="58" y="244" class="display" font-size="96" font-weight="800" letter-spacing="-2" fill="#ECE8DF">KENNETH</text>
    <text x="64" y="288" class="display" font-size="20" fill="#8B9099">Computer Science · Software Technology</text>
    <text x="64" y="314" class="display" font-size="20" fill="#8B9099">De La Salle University, Manila</text>
    <text x="64" y="352" class="mono" font-size="15" fill="#ECE8DF"><tspan fill="#8B9099">$</tspan> beta holds clip.mp4 --color green</text>
    <text x="64" y="376" class="mono" font-size="15" fill="#3FB57A">→ route: 7 holds · pose: 33 landmarks</text>

    <!-- route holds, numbered from the bottom like holds.json -->
    <polygon class="hold" points="833,361 838,350 851,347 864,351 868,359 858,366 840,366"/>
    <polygon class="hold" points="1027,340 1032,327 1047,323 1061,328 1066,339 1057,348 1036,348"/>
    <polygon class="hold" points="962,295 967,284 981,281 994,285 999,294 990,301 970,301"/>
    <polygon class="hold" points="767,240 772,226 787,221 802,227 806,240 795,250 776,249"/>
    <polygon class="hold" points="808,154 814,140 831,136 848,140 854,152 845,163 821,163"/>
    <polygon class="hold" points="951,58 957,45 973,41 988,46 994,57 984,67 962,67"/>
    <polygon class="hold" points="1061,48 1068,34 1086,29 1106,32 1116,44 1107,56 1086,60 1068,57"/>

    <!-- topo line, drawn on through the mask -->
    <path d="M868 398 C864 340 892 300 898 244 S928 126 968 74 S1058 44 1088 44" fill="none" stroke="#ECE8DF" stroke-opacity=".55" stroke-width="4" stroke-linecap="round" stroke-dasharray="0.1 12" mask="url(#route-reveal)"/>

    <!-- climber: left side blue, right side orange, as in pose_debug.mp4 -->
    <g>
      <path class="halo" d="M872 168 L920 156 M884 246 L916 240 M872 168 L884 246 M920 156 L916 240 M872 168 L842 206 L832 164 L830 154 M920 156 L948 112 L968 70 L971 60 M884 246 L868 298 L858 346 L848 354 M916 240 L966 228 L966 280 L978 288 M899 139 L896 162"/>
      <path class="bone mid" d="M872 168 L920 156 M884 246 L916 240 M899 139 L896 162"/>
      <path class="bone left" d="M872 168 L884 246 M872 168 L842 206 L832 164 L830 154 M884 246 L868 298 L858 346 L848 354"/>
      <path class="bone right" d="M920 156 L916 240 M920 156 L948 112 L968 70 L971 60 M916 240 L966 228 L966 280 L978 288"/>
      <circle cx="900" cy="124" r="15" fill="#1D2026" stroke="#ECE8DF" stroke-width="3"/>
      <circle class="joint" cx="872" cy="168" r="4.5"/>
      <circle class="joint" cx="920" cy="156" r="4.5"/>
      <circle class="joint" cx="842" cy="206" r="4.5"/>
      <circle class="joint" cx="948" cy="112" r="4.5"/>
      <circle class="joint" cx="832" cy="164" r="4.5"/>
      <circle class="joint" cx="968" cy="70" r="4.5"/>
      <circle class="joint" cx="884" cy="246" r="4.5"/>
      <circle class="joint" cx="916" cy="240" r="4.5"/>
      <circle class="joint" cx="868" cy="298" r="4.5"/>
      <circle class="joint" cx="966" cy="228" r="4.5"/>
      <circle class="joint" cx="858" cy="346" r="4.5"/>
      <circle class="joint" cx="966" cy="280" r="4.5"/>
    </g>

    <!-- hold numbers -->
    <g class="mono">
      <g class="tag" style="animation-delay:.6s"><circle cx="824" cy="344" r="11"/><text x="824" y="344" dy=".35em">1</text></g>
      <g class="tag" style="animation-delay:.8s"><circle cx="1072" cy="320" r="11"/><text x="1072" y="320" dy=".35em">2</text></g>
      <g class="tag" style="animation-delay:1.1s"><circle cx="1006" cy="276" r="11"/><text x="1006" y="276" dy=".35em">3</text></g>
      <g class="tag" style="animation-delay:1.4s"><circle cx="764" cy="220" r="11"/><text x="764" y="220" dy=".35em">4</text></g>
      <g class="tag" style="animation-delay:1.8s"><circle cx="806" cy="134" r="11"/><text x="806" y="134" dy=".35em">5</text></g>
      <g class="tag" style="animation-delay:2.1s"><circle cx="998" cy="38" r="11"/><text x="998" y="38" dy=".35em">6</text></g>
      <g class="tag" style="animation-delay:2.5s"><circle cx="1124" cy="28" r="11"/><text x="1124" y="28" dy=".35em">7</text></g>
    </g>
  </g>
</svg>
